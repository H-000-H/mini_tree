name: h-000-h/mini-tree
version: "1.4.5"
description: "这是一个通用的vfs驱动模型和dts抽象设备树和os抽象插件 (ESP-IDF 组件线: lib 仅含 etl, RTOS 走 IDF 内置 FreeRTOS)"
url: "https://github.com/H-000-H/mini_tree"
dependencies:
  idf:
    version: ">=4.4"
files:
  exclude:
    - "build/**"
    - "dist/**"
    - ".venv/**"
    - ".cache/**"
    - "compile_commands.json"
    - ".config*"
    - ".git/**"
    - "esp-component.sh"
    - ".component_hash"
    - "CHECKSUMS.json"
    # RTOS 内核一律不进 esp 组件包: 走 ESP-IDF 内置 FreeRTOS
    - "lib/freeRTOS/**"
    - "lib/rtthread/**"
    - "lib/mini-os/**"
    - "lib/threadx/**"
    - "lib/uC-*/**"
    - "**/__pycache__/**"
    - "**/*.pyc"
